[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersum"
version = "0.1.0"
description = "Deterministic SQL aggregation as a grounding layer for LLM-generated security briefings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.42",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
# Live API collectors for the ingestion side. Not needed for the demo or the
# evaluation harness, both of which run entirely off synthetic data.
collectors = ["requests>=2.31"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
cybersum = "cybersum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cybersum = ["prompts/*.txt", "prompts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs a live PostgreSQL (run `make db-up` first)",
]
# Default to the no-DB, no-network suite.
addopts = "-m 'not postgres'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src/cybersum"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
# psycopg2 and azure.functions ship no stubs we depend on.
[[tool.mypy.overrides]]
module = ["psycopg2.*", "azure.*"]
ignore_missing_imports = true
