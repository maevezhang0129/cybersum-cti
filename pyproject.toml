[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersum"
version = "0.1.0"
description = "Deterministic SQL aggregation as a grounding layer for LLM-generated security briefings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.42",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
# Live API collectors for the ingestion side. Not needed for the demo or the
# evaluation harness, both of which run entirely off synthetic data.
collectors = ["requests>=2.31"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # Imported directly by tests to build the httpx objects the OpenAI SDK's
    # exception classes require. It arrives transitively via openai, but the
    # tests depend on it by name, so it is declared by name.
    "httpx>=0.27",
]

[project.scripts]
cybersum = "cybersum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cybersum = ["prompts/*.txt", "prompts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs a live PostgreSQL (run `make db-up` first)",
]
# Default to the no-DB, no-network suite.
addopts = "-m 'not postgres'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE is on so every broad `except Exception` has to justify itself with a
# noqa and a reason. Several are deliberate here: delivery and persistence
# failures must not lose a generated report.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "BLE"]

[tool.ruff.lint.per-file-ignores]
# The collectors are carried over from the deployed system essentially
# unchanged -- only internal identifiers were removed. They are evidence of
# what ran, so they are not rewritten to satisfy style rules that would
# require restructuring their error handling. Whitespace and import order
# were fixed mechanically; the judgement calls below were not.
"src/cybersum/collectors/*.py" = ["B904", "BLE001", "E501", "RUF001", "RUF002", "RUF003"]


[tool.mypy]
python_version = "3.11"
files = ["src/cybersum"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
# psycopg2 and azure.functions ship no stubs we depend on.
[[tool.mypy.overrides]]
module = ["psycopg2.*", "azure.*", "requests.*", "dotenv.*"]
ignore_missing_imports = true

# The collectors are preserved from the deployed system rather than rewritten
# -- see the matching note under [tool.ruff.lint.per-file-ignores]. Annotating
# them would mean editing code kept as a record of what ran.
[[tool.mypy.overrides]]
module = "cybersum.collectors.*"
disallow_untyped_defs = false
check_untyped_defs = false
